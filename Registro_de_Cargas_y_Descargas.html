<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro de Cargas y Descargas</title>
<style>
  :root{
    --bg:#14171c;
    --panel:#1c2129;
    --panel-2:#232a34;
    --line:#323a46;
    --amber:#e8a23d;
    --amber-dim:#7a5a26;
    --text:#eef1f5;
    --text-dim:#98a3b3;
    --green:#4caf7d;
    --blue:#4fb3ff;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:100px;}

  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#171b21,#14171c 90%);
    border-bottom:2px solid var(--amber-dim);
    padding:14px 16px 12px;
  }
  header h1{margin:0 0 2px;font-size:17px;letter-spacing:.3px;font-weight:700;}
  header .sub{font-size:12px;color:var(--text-dim);}
  .repeating-tick{
    position:absolute;inset:0;pointer-events:none;opacity:.06;
    background-image:repeating-linear-gradient(135deg,var(--amber) 0 2px, transparent 2px 14px);
  }

  .meta{display:flex;gap:8px;padding:12px 16px 4px;flex-wrap:wrap;}
  .meta label{
    flex:1;min-width:130px;display:flex;flex-direction:column;gap:4px;
    font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;
  }
  .meta input, .meta select{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px 10px;font-size:14px;
  }
  .meta input:focus, .meta select:focus{outline:none;border-color:var(--amber);}

  main{padding:12px 10px 0;}

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);
    border:1px solid var(--line);}
  .scroll-hint{font-size:10px;color:var(--text-dim);padding:6px 12px 0;}

  table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:796px;}
  col.n{width:30px;}
  col.remolque{width:180px;}
  col.hora{width:92px;}
  col.prov{width:130px;}
  col.obs{width:170px;}

  thead th{
    font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.2px;
    font-weight:600;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);
    background:var(--panel-2);white-space:normal;line-height:1.2;position:sticky;top:0;
  }
  tbody td{padding:5px 4px;border-bottom:1px solid var(--line);background:var(--panel);
    vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  td.n{text-align:center;color:var(--amber);font-weight:700;font-size:12px;}

  td input[type=time], td input[type=text]{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;
    color:var(--text);font-size:12.5px;padding:6px 4px;
  }
  td select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;
    color:var(--text);font-size:12px;padding:6px 2px;
  }
  td select.prov-otro-input{margin-top:4px;display:none;}
  td select:focus, td input:focus{outline:none;border-color:var(--amber);}

  .row-remolque{
    display:flex;align-items:center;gap:4px;
  }
  .row-remolque .remolque-value{
    flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;
    color:var(--text);font-size:10.5px;padding:6px 4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row-remolque .remolque-value.empty{
    color:var(--text-dim);font-family:inherit;text-transform:none;font-size:10px;
  }
  .row-remolque .remolque-manual-input{
    flex:1;min-width:0;width:auto;background:var(--bg);border:1px solid var(--amber);border-radius:6px;
    color:var(--text);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:6px 5px;text-transform:uppercase;
  }
  .row-remolque .remolque-btn{
    flex:none;width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;
    background:#3a4453;border:none;border-radius:6px;color:var(--text);font-size:11px;line-height:1;
  }
  .row-remolque .remolque-btn.mic{background:#2a6f4f;color:#eafff2;}
  .row-remolque .remolque-btn.mic.listening{
    background:var(--red,#ff5a5a);animation:pulseMicRow 1s infinite;
  }
  @keyframes pulseMicRow{0%,100%{opacity:1;}50%{opacity:.6;}}

  .rowsfoot{display:flex;justify-content:center;padding:12px 4px 4px;}

  .btn-addrow{
    background:var(--panel);border:1px dashed var(--amber-dim);color:var(--amber);
    font-size:13px;font-weight:700;border-radius:9px;padding:10px 18px;
  }

  .toast{
    position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--amber-dim);color:var(--text);
    padding:9px 16px;border-radius:20px;font-size:12.5px;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:40;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(0deg,#14171c 70%, rgba(20,23,28,0));
    padding:10px 12px 14px;
  }
  .footer-inner{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;display:flex;align-items:center;gap:8px;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  .footer-label{flex:1;font-size:11px;color:var(--text-dim);line-height:1.3;}
  .footer-label b{display:block;color:var(--text);font-size:13px;}
  .btn{border:none;border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn-clear{background:transparent;color:var(--text-dim);border:1px solid var(--line);padding:11px 12px;}
  .btn-share{background:#25D366;color:#0b1a10;}
  .btn:active{transform:scale(.96);}
</style>
</head>
<body>

<header>
  <div class="repeating-tick"></div>
  <h1>Registro de Cargas y Descargas</h1>
  <div class="sub">Rellena cada fila del turno · se guarda solo en este teléfono</div>
</header>

<div class="meta">
  <label>Fecha
    <input type="date" id="fecha">
  </label>
  <label>Turno
    <select id="turno">
      <option value="MAÑANA">MAÑANA</option>
      <option value="TARDE">TARDE</option>
      <option value="NOCHE">NOCHE</option>
    </select>
  </label>
</div>

<main>
  <div class="table-wrap">
    <table id="tabla">
      <colgroup>
        <col class="n"><col class="remolque"><col class="hora"><col class="hora">
        <col class="prov"><col class="prov"><col class="hora"><col class="obs">
      </colgroup>
      <thead><tr>
        <th>Nº</th>
        <th>Remolque</th>
        <th>Hora<br>llegada</th>
        <th>Hora inicio<br>descarga</th>
        <th>Proveedor<br>DESCARGA</th>
        <th>Proveedor<br>CARGA</th>
        <th>Hora<br>salida</th>
        <th>Incidencias /<br>observaciones</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="scroll-hint">↔ desliza para ver todas las columnas</div>
  <div class="rowsfoot">
    <button class="btn-addrow" id="addRowBtn">+ Añadir fila</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<footer>
  <div class="footer-inner">
    <div class="footer-label">Hoja del turno<br><b id="footerDate">—</b></div>
    <button class="btn btn-clear" id="clearBtn" title="Vaciar esta hoja">🗑</button>
    <button class="btn btn-share" id="shareBtn">📷 Compartir imagen</button>
  </div>
</footer>

<script>
const PROVIDERS = [
  "KWD","GESTAMP","MAGNA","ZONA FRANCA","SEAT MARTORELL","MELEGHY","NEINSA",
  "AISA","MB","AUTOEUROPA","METAL DAGES","Otro..."
];
const STORAGE_KEY = "registro_cargas_descargas_v1";
const DEFAULT_ROWS = 15;

function blankRow(){
  return { remolque:"", llegada:"", inicio:"", provDesc:"", provDescOtro:"", provCarga:"", provCargaOtro:"", salida:"", obs:"" };
}
function blankRows(n){
  const arr = [];
  for(let i=0;i<n;i++) arr.push(blankRow());
  return arr;
}

let state = { fecha:"", turno:"TARDE", sheets:{} }; // sheets["date|turno"] = { rows:[...] }
let editingRemolqueRow = null; // índice de fila cuya matrícula se está editando manualmente (no se guarda)

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ /* seguimos solo en memoria si falla */ }
  if(!state.sheets) state.sheets = {};
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* si falla, los datos siguen disponibles en memoria durante esta sesión */ }
}

function normalizeRow(r){
  r = r || {};
  let remolque = "";
  if(typeof r.remolque === "string"){
    remolque = r.remolque;
  }else if(r.remolque && (r.remolque.num || r.remolque.let)){
    // datos antiguos con formato {num, let}: los convertimos a texto libre
    remolque = `R ${r.remolque.num || ""} ${(r.remolque.let || "").toUpperCase()}`.replace(/\s+/g," ").trim();
  }
  return {
    remolque,
    llegada: r.llegada || "",
    inicio: r.inicio || "",
    provDesc: r.provDesc || "",
    provDescOtro: r.provDescOtro || "",
    provCarga: r.provCarga || "",
    provCargaOtro: r.provCargaOtro || "",
    salida: r.salida || "",
    obs: r.obs || "",
  };
}

function sheetKey(){ return (state.fecha || "") + "|" + (state.turno || ""); }
function currentSheet(){
  const k = sheetKey();
  if(!state.sheets[k]){ state.sheets[k] = { rows: blankRows(DEFAULT_ROWS) }; }
  const sheet = state.sheets[k];
  sheet.rows = sheet.rows.map(normalizeRow);
  return sheet;
}

const fechaEl = document.getElementById("fecha");
const turnoEl = document.getElementById("turno");
const tbody = document.getElementById("tbody");
const footerDateEl = document.getElementById("footerDate");

function providerSelectHTML(rowIdx, field, value, otroValue){
  const opts = PROVIDERS.map(p=>{
    const sel = (p === value) ? "selected" : "";
    return `<option value="${p}" ${sel}>${p}</option>`;
  }).join("");
  const emptyOpt = `<option value="" ${value?"":"selected"}>—</option>`;
  const showOtro = value === "Otro...";
  return `
    <select class="prov-select" data-row="${rowIdx}" data-field="${field}">
      ${emptyOpt}${opts}
    </select>
    <input type="text" class="prov-otro-input" data-row="${rowIdx}" data-field="${field}Otro"
      placeholder="Escribe proveedor" value="${otroValue||""}" style="display:${showOtro?"block":"none"}">
  `;
}

function timeInputHTML(rowIdx, field, value){
  return `<input type="time" data-row="${rowIdx}" data-field="${field}" value="${value || ""}">`;
}

// ---------- FORMATO DE MATRÍCULA ----------
// Normaliza y separa la matrícula en grupos (ej: "R9342BBJ" -> "R 9342 BBJ", "9342BBJ" -> "9342 BBJ")
// La "R" solo aparece si el usuario la escribe o la dice.
function formatMatricula(raw){
  if(!raw) return "";
  let s = String(raw).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  s = s.replace(/[^A-Z0-9\s]/g,"");
  s = s.replace(/\s+/g," ").trim();
  if(!s) return "";

  let rPrefix = "";
  let rest = s;
  if(/^R[\s]?\d/.test(s)){
    rPrefix = "R ";
    rest = s.replace(/^R\s?/, "");
  }
  rest = rest.replace(/\s+/g,"");

  const m = rest.match(/^(\d{1,4})([A-Z]{1,3})$/);
  if(m){
    return `${rPrefix}${m[1]} ${m[2]}`.trim();
  }
  return (rPrefix + rest).trim();
}

// ---------- MATRÍCULA POR VOZ ----------
const DIGIT_WORDS_PLATE = {
  "cero":"0","uno":"1","un":"1","una":"1","dos":"2","tres":"3","cuatro":"4",
  "cinco":"5","seis":"6","siete":"7","ocho":"8","nueve":"9"
};
const LETTER_WORDS_PLATE = {
  "a":"A","be":"B","uve":"V","ve":"V","ce":"C","de":"D","e":"E","efe":"F","ge":"G",
  "hache":"H","i":"I","jota":"J","ka":"K","ele":"L","eme":"M","ene":"N","o":"O","pe":"P",
  "cu":"Q","erre":"R","ere":"R","ese":"S","te":"T","u":"U","doblev":"W","uvedoble":"W",
  "equis":"X","ye":"Y","igriega":"Y","zeta":"Z","ceta":"Z"
};
function parseSpokenMatricula(transcript){
  const norm = String(transcript||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const tokens = norm.replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  let hasLeadingR = false, digits = "", letters = "", started = false;
  tokens.forEach(tok=>{
    if(!started && (tok==="erre" || tok==="ere" || tok==="r")){
      hasLeadingR = true; started = true; return;
    }
    started = true;
    if(/^\d+$/.test(tok)){ digits += tok; return; }
    if(tok in DIGIT_WORDS_PLATE){ digits += DIGIT_WORDS_PLATE[tok]; return; }
    if(tok.length===1 && /^[a-z]$/.test(tok)){ letters += tok.toUpperCase(); return; }
    if(tok in LETTER_WORDS_PLATE){ letters += LETTER_WORDS_PLATE[tok]; return; }
    if(/^[a-z]{2,4}$/.test(tok) && digits!==""){ letters += tok.toUpperCase(); return; }
  });
  let result = digits;
  if(letters) result += (result ? " " : "") + letters;
  if(hasLeadingR) result = "R " + result;
  return result.trim();
}

const RemolqueRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let remolqueRecognition = null;
let activeRemolqueRow = null;
let activeRemolqueBtn = null;

if(RemolqueRecognitionCtor){
  remolqueRecognition = new RemolqueRecognitionCtor();
  remolqueRecognition.lang = "es-ES";
  remolqueRecognition.continuous = false;
  remolqueRecognition.interimResults = false;

  remolqueRecognition.addEventListener("start", ()=>{
    if(activeRemolqueBtn) activeRemolqueBtn.classList.add("listening");
    showToast("Escuchando... di la matrícula");
  });
  remolqueRecognition.addEventListener("end", ()=>{
    if(activeRemolqueBtn) activeRemolqueBtn.classList.remove("listening");
  });
  remolqueRecognition.addEventListener("error", ()=>{
    if(activeRemolqueBtn) activeRemolqueBtn.classList.remove("listening");
    showToast("El micrófono no funciona así (archivo local) · usa el lápiz para escribirla");
  });
  remolqueRecognition.addEventListener("result", (e)=>{
    const transcript = e.results[0][0].transcript;
    const parsed = parseSpokenMatricula(transcript);
    const formatted = formatMatricula(parsed || transcript);
    if(!formatted || activeRemolqueRow === null){ showToast(`No he entendido "${transcript}"`); return; }
    currentSheet().rows[activeRemolqueRow].remolque = formatted;
    saveState();
    editingRemolqueRow = null;
    render();
    showToast(`Matrícula: ${formatted}`);
  });
}

function startRemolqueMic(rowIdx, btn){
  if(!remolqueRecognition){
    showToast("El micrófono no está disponible aquí: usa el lápiz para escribirla");
    return;
  }
  activeRemolqueRow = rowIdx;
  activeRemolqueBtn = btn;
  try{ remolqueRecognition.start(); }catch(err){}
}

function remolqueCellHTML(rowIdx, row){
  if(editingRemolqueRow === rowIdx){
    return `
      <span class="row-remolque">
        <input type="text" class="remolque-manual-input" data-row="${rowIdx}" placeholder="Matrícula"
          value="${row.remolque || ""}" autocomplete="off">
        <button type="button" class="remolque-btn mic" data-row="${rowIdx}" title="Decir la matrícula por voz">&#127908;</button>
      </span>
    `;
  }
  const val = row.remolque || "";
  return `
    <span class="row-remolque">
      <span class="remolque-value ${val?"":"empty"}">${val || "Sin matrícula"}</span>
      <button type="button" class="remolque-btn edit" data-row="${rowIdx}" title="Escribir matrícula">&#9999;&#65039;</button>
      <button type="button" class="remolque-btn mic" data-row="${rowIdx}" title="Decir la matrícula por voz">&#127908;</button>
    </span>
  `;
}

function render(){
  fechaEl.value = state.fecha || "";
  turnoEl.value = state.turno || "TARDE";
  footerDateEl.textContent = `${state.turno || "—"} · ${state.fecha ? new Date(state.fecha+"T00:00:00").toLocaleDateString("es-ES") : "—"}`;

  const sheet = currentSheet();
  tbody.innerHTML = "";
  sheet.rows.forEach((row, i)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="n">${i+1}º</td>
      <td>${remolqueCellHTML(i, row)}</td>
      <td>${timeInputHTML(i, "llegada", row.llegada)}</td>
      <td>${timeInputHTML(i, "inicio", row.inicio)}</td>
      <td>${providerSelectHTML(i, "provDesc", row.provDesc, row.provDescOtro)}</td>
      <td>${providerSelectHTML(i, "provCarga", row.provCarga, row.provCargaOtro)}</td>
      <td>${timeInputHTML(i, "salida", row.salida)}</td>
      <td><input type="text" data-row="${i}" data-field="obs" value="${row.obs}" placeholder="—"></td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll("input[type=text]:not(.prov-otro-input):not(.remolque-manual-input), input[type=time]").forEach(inp=>{
    inp.addEventListener("input", onFieldInput);
  });
  tbody.querySelectorAll(".prov-otro-input").forEach(inp=>{
    inp.addEventListener("input", onFieldInput);
  });
  tbody.querySelectorAll(".prov-select").forEach(sel=>{
    sel.addEventListener("change", e=>{
      onFieldInput(e);
      const otroInput = e.target.parentElement.querySelector(".prov-otro-input");
      otroInput.style.display = (e.target.value === "Otro...") ? "block" : "none";
    });
  });
  tbody.querySelectorAll(".remolque-btn.edit").forEach(btn=>{
    btn.addEventListener("click", e=>{
      const rowIdx = parseInt(e.currentTarget.dataset.row,10);
      editingRemolqueRow = rowIdx;
      render();
      const inp = tbody.querySelector(`.remolque-manual-input[data-row="${rowIdx}"]`);
      if(inp){ inp.focus(); inp.select(); }
    });
  });
  tbody.querySelectorAll(".remolque-btn.mic").forEach(btn=>{
    btn.addEventListener("click", e=>{
      const rowIdx = parseInt(e.currentTarget.dataset.row,10);
      startRemolqueMic(rowIdx, e.currentTarget);
    });
  });
  tbody.querySelectorAll(".remolque-manual-input").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const rowIdx = parseInt(e.target.dataset.row,10);
      currentSheet().rows[rowIdx].remolque = e.target.value.toUpperCase();
      saveState();
    });
    inp.addEventListener("keydown", e=>{
      if(e.key === "Enter"){ e.target.blur(); }
    });
    inp.addEventListener("blur", e=>{
      const rowIdx = parseInt(e.target.dataset.row,10);
      const formatted = formatMatricula(e.target.value);
      currentSheet().rows[rowIdx].remolque = formatted;
      saveState();
      editingRemolqueRow = null;
      render();
    });
  });
}

function onFieldInput(e){
  const { row, field } = e.target.dataset;
  const sheet = currentSheet();
  sheet.rows[parseInt(row,10)][field] = e.target.value;
  saveState();
}

fechaEl.addEventListener("change", ()=>{ state.fecha = fechaEl.value; saveState(); render(); });
turnoEl.addEventListener("change", ()=>{ state.turno = turnoEl.value; saveState(); render(); });

document.getElementById("addRowBtn").addEventListener("click", ()=>{
  currentSheet().rows.push(blankRow());
  saveState();
  render();
});

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove("show"), 2200);
}

function resolvedProvider(row, field){
  const val = row[field];
  if(!val) return "";
  if(val === "Otro...") return row[field+"Otro"] || "Otro";
  return val;
}

function remolqueLabel(row){
  return row.remolque || "";
}

function hasAnyData(row){
  return row.remolque || row.llegada || row.inicio || row.provDesc || row.provCarga || row.salida || row.obs;
}

// ---------- RESUMEN POR PROVEEDOR ----------
function computeProviderSummary(){
  const sheet = currentSheet();
  const byProvider = {}; // { nombre: {carga:N, descarga:N} }
  const order = [];
  sheet.rows.forEach(row=>{
    const desc = resolvedProvider(row, "provDesc");
    const carga = resolvedProvider(row, "provCarga");
    if(desc){
      if(!byProvider[desc]){ byProvider[desc] = { carga:0, descarga:0 }; order.push(desc); }
      byProvider[desc].descarga += 1;
    }
    if(carga){
      if(!byProvider[carga]){ byProvider[carga] = { carga:0, descarga:0 }; order.push(carga); }
      byProvider[carga].carga += 1;
    }
  });
  order.sort((a,b)=> a.localeCompare(b));
  return order.map(name=> ({ name, ...byProvider[name] }));
}


document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(confirm("¿Vaciar esta hoja (fecha y turno actuales)? Esta acción no se puede deshacer.")){
    state.sheets[sheetKey()] = { rows: blankRows(DEFAULT_ROWS) };
    saveState();
    render();
    showToast("Hoja vaciada");
  }
});

// ---------- IMAGEN ----------
function renderSheetCanvas(){
  const sheet = currentSheet();
  const filledRows = sheet.rows.filter(hasAnyData);
  const summary = computeProviderSummary();
  const fecha = state.fecha ? new Date(state.fecha+"T00:00:00").toLocaleDateString("es-ES") : "(sin fecha)";

  const W = 1000, PAD = 40;
  const COL = { bg:"#12151a", panel:"#1c2129", line:"#323a46",
    text:"#eef1f5", dim:"#98a3b3", amber:"#e8a23d", blue:"#4fb3ff", green:"#4caf7d" };
  const H_TITLE=56, H_META=34, H_SPACER=18, H_ROW=64, H_EMPTY=40;
  const H_SUMTITLE=46, H_SUMHEAD=38, H_SUMROW=44, H_SUMTOTAL=54, H_GRANDTOTAL=58;

  let totalH = PAD*2 + H_TITLE + H_META + H_SPACER;
  totalH += filledRows.length ? filledRows.length * H_ROW : H_EMPTY;
  if(summary.length > 0){
    totalH += H_SPACER + H_SUMTITLE + H_SUMHEAD + summary.length*H_SUMROW + H_SUMTOTAL + 10 + H_GRANDTOTAL;
  }

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = totalH;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,totalH);

  let y = PAD;
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.fillStyle = COL.text; ctx.font = "700 36px system-ui,sans-serif";
  ctx.fillText("📋 Registro de Cargas y Descargas", PAD, y + H_TITLE/2);
  y += H_TITLE;

  ctx.fillStyle = COL.dim; ctx.font = "500 22px system-ui,sans-serif";
  ctx.fillText(`${state.turno || "—"}   ·   ${fecha}`, PAD, y + H_META/2);
  y += H_META + H_SPACER;

  if(filledRows.length === 0){
    ctx.fillStyle = COL.dim; ctx.font = "22px system-ui,sans-serif";
    ctx.fillText("No hay filas rellenadas todavía.", PAD, y + H_EMPTY/2);
    y += H_EMPTY;
  }else{
    filledRows.forEach((row, idx)=>{
      // tarjeta de fondo
      ctx.fillStyle = COL.panel;
      ctx.fillRect(PAD-16, y+4, W-(PAD-16)*2, H_ROW-8);

      const cy1 = y + 22, cy2 = y + 46;
      ctx.font = "700 20px system-ui,sans-serif"; ctx.fillStyle = COL.amber;
      ctx.fillText(`${idx+1}º`, PAD, cy1);

      ctx.font = "600 19px system-ui,sans-serif"; ctx.fillStyle = COL.text;
      const horas = `${row.llegada || "--:--"} → ${row.inicio || "--:--"} → ${row.salida || "--:--"}`;
      const rem = remolqueLabel(row);
      ctx.fillText(rem ? `${rem}   ${horas}` : horas, PAD+50, cy1);

      const desc = resolvedProvider(row, "provDesc");
      const carga = resolvedProvider(row, "provCarga");
      ctx.font = "600 19px system-ui,sans-serif";
      ctx.fillStyle = COL.blue;
      let line2 = "";
      if(desc) line2 += "Descarga: " + desc + "   ";
      if(carga) line2 += "Carga: " + carga;
      ctx.fillText(line2 || "—", PAD+50, cy2);

      if(row.obs){
        ctx.font = "italic 18px system-ui,sans-serif"; ctx.fillStyle = COL.dim;
        ctx.textAlign = "right";
        ctx.fillText(row.obs, W-PAD+16, cy1);
        ctx.textAlign = "left";
      }
      y += H_ROW;
    });
  }

  // ---------- Resumen por proveedor, debajo de las filas, en la misma imagen ----------
  if(summary.length > 0){
    y += H_SPACER;
    ctx.textAlign = "left";
    ctx.fillStyle = COL.amber; ctx.font = "700 26px system-ui,sans-serif";
    ctx.fillText("Resumen del turno por proveedor", PAD, y + H_SUMTITLE/2);
    y += H_SUMTITLE;

    ctx.fillStyle = COL.panel; ctx.fillRect(PAD-16, y, W-(PAD-16)*2, H_SUMHEAD);
    ctx.font = "700 16px system-ui,sans-serif"; ctx.fillStyle = COL.dim;
    ctx.fillText("PROVEEDOR", PAD, y + H_SUMHEAD/2);
    ctx.textAlign = "right";
    ctx.fillText("CARGAS", W-380, y + H_SUMHEAD/2);
    ctx.fillText("DESCARGAS", W-PAD, y + H_SUMHEAD/2);
    ctx.textAlign = "left";
    y += H_SUMHEAD;

    summary.forEach((p, i)=>{
      if(i % 2 === 1){ ctx.fillStyle = COL.panel; ctx.fillRect(PAD-16, y, W-(PAD-16)*2, H_SUMROW); }
      ctx.font = "700 20px system-ui,sans-serif"; ctx.fillStyle = COL.text;
      ctx.fillText(p.name, PAD, y + H_SUMROW/2);
      ctx.textAlign = "right";
      ctx.fillStyle = COL.amber;
      ctx.fillText(String(p.carga), W-380, y + H_SUMROW/2);
      ctx.fillStyle = COL.blue;
      ctx.fillText(String(p.descarga), W-PAD, y + H_SUMROW/2);
      ctx.textAlign = "left";
      y += H_SUMROW;
    });

    const totalCargas = summary.reduce((s,p)=> s+p.carga, 0);
    const totalDescargas = summary.reduce((s,p)=> s+p.descarga, 0);
    ctx.fillStyle = COL.panel;
    ctx.fillRect(PAD-16, y+6, W-(PAD-16)*2, H_SUMTOTAL-12);
    ctx.strokeStyle = COL.green; ctx.lineWidth = 2;
    ctx.strokeRect(PAD-16, y+6, W-(PAD-16)*2, H_SUMTOTAL-12);
    ctx.fillStyle = COL.green; ctx.font = "800 24px system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`✅ Resumen: ${totalCargas} cargas · ${totalDescargas} descargas`, W/2, y + H_SUMTOTAL/2);
    y += H_SUMTOTAL + 10;

    ctx.fillStyle = COL.panel;
    ctx.fillRect(PAD-16, y, W-(PAD-16)*2, H_GRANDTOTAL-6);
    ctx.strokeStyle = COL.amber; ctx.lineWidth = 2;
    ctx.strokeRect(PAD-16, y, W-(PAD-16)*2, H_GRANDTOTAL-6);
    ctx.fillStyle = COL.amber; ctx.font = "800 26px system-ui,sans-serif";
    ctx.fillText(`TOTAL: ${totalCargas + totalDescargas}`, W/2, y + (H_GRANDTOTAL-6)/2);
    ctx.textAlign = "left";
  }

  return canvas;
}

async function shareSheetImage(){
  const sheet = currentSheet();
  if(!sheet.rows.some(hasAnyData)){
    showToast("Todavía no has rellenado ninguna fila");
    return;
  }
  const canvas = renderSheetCanvas();
  canvas.toBlob(async (blob)=>{
    if(!blob){ showToast("No se pudo generar la imagen"); return; }
    const file = new File([blob], "registro_cargas.png", { type: "image/png" });
    try{
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:"Registro de Cargas y Descargas" });
        return;
      }
    }catch(e){ /* cancelado o no soportado: seguimos con la descarga */ }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "registro_cargas.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    showToast("Imagen descargada · adjúntala en WhatsApp");
  }, "image/png");
}
document.getElementById("shareBtn").addEventListener("click", shareSheetImage);

// ---------- INIT ----------
try{
  loadState();
  if(!state.fecha){
    const today = new Date();
    state.fecha = today.toISOString().slice(0,10);
  }
  render();
}catch(err){
  document.getElementById("tbody").innerHTML =
    `<tr><td colspan="7" style="padding:14px;color:#ff8080;font-size:12px;">
      Error al cargar la hoja: ${String(err && err.message || err)}.<br>
      Prueba a pulsar 🗑 para vaciar esta hoja y volver a empezar.
    </td></tr>`;
}
</script>
